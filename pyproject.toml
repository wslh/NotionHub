[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weread2notion"
version = "2.12.0"
description = "NotionHub: connect your digital life to Notion. Sync WeRead, Flomo, GitHub and more through a plugin hub."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "wslh"}]
keywords = ["weread", "wechat-reading", "notion", "reading-notes", "github-actions"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "requests",
  "notion-client",
  "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/wslh/NotionHub"
Documentation = "https://github.com/wslh/NotionHub#readme"
Issues = "https://github.com/wslh/NotionHub/issues"
Template = "https://app.notion.com/p/wph/Template-3a329affe5af800b8581f98b71e948fb"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
weread2notion = "weread2notion.cli:main"
notionhub = "weread2notion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 `pytest` 开箱即用：仓库以 src 布局组织，未 pip install 时也能直接 import weread2notion。
pythonpath = ["src"]

