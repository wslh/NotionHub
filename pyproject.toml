[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weread2notion"
version = "2.12.0"
description = "NotionHub: connect your digital life to Notion. Sync WeRead, Flomo, GitHub and more through a plugin hub."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "wslh"}]
keywords = ["weread", "wechat-reading", "notion", "reading-notes", "github-actions"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "requests",
  "notion-client",
  "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/wslh/NotionHub"
Documentation = "https://github.com/wslh/NotionHub#readme"
Issues = "https://github.com/wslh/NotionHub/issues"
Template = "https://app.notion.com/p/wph/Template-3a329affe5af800b8581f98b71e948fb"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
weread2notion = "weread2notion.cli:main"
notionhub = "weread2notion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# 质量门配置：规则集固定，避免 CI 在不同版本下行为漂移。
# 注：当前代码尚有约 130 条 E4/E7/E9/F/I 类告警（import 排序、未用变量等，其中 80 条可 --fix 自动修），
# 故 CI lint 暂保持 continue-on-error（提供信号但不阻断流水线）；待 `ruff check --fix` 清理后可改为阻断。
line-length = 100
target-version = "py310"
src = ["src", "tests"]
lint.select = ["E4", "E7", "E9", "F", "I"]
lint.ignore = ["E501"]  # 中文文案常超 88，放宽到 line-length=100

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 `pytest` 开箱即用：仓库以 src 布局组织，未 pip install 时也能直接 import weread2notion。
pythonpath = ["src"]


