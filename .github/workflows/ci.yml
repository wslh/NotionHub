# CI —— 自动构建、测试与质量门
#
# 触发：推送到 main/master 分支，或针对这些分支的 Pull Request。
# 包含三个 job：
#   1. lint  —— 用 ruff 做静态检查（首次接入设为不阻断，代码清理后可改为阻断）
#   2. test  —— 在 3.10 / 3.11 / 3.12 / 3.13 上安装并运行 pytest（含覆盖率）
#   3. build —— 构建 sdist + wheel，并用 twine 校验（仅在 test 通过后执行）
#
# 说明：本项目为 src/ 布局的 setuptools 包，测试全部基于 mock，无需任何网络或密钥。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# 同一 ref 同时只跑一次，新触发取消旧运行，避免资源浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # 首次接入时先不阻断流水线；待代码清理干净后改为 false 即可作为质量门
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v1
        with:
          args: "check ."

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pip install pytest-cov

      - name: Run tests with coverage
        run: |
          pytest -q \
            --cov=weread2notion --cov-report=term-missing \
            --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
