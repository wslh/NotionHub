name: sync (self-hosted)

# 多数据源自托管同步工作流（取代 NotionHub 生成的全部 nh-*.yml 云端工作流）。
# 使用本仓库自身的 weread2notion 包（经根目录 action.yml 封装）执行同步，
# 不再依赖 notionhub-runner 从外部仓库拉取代码。
#
# 触发方式：
#   1) 定时：每天北京时间 05:00（UTC 21:00）运行 `plugins sync --all --exclude weread`，
#      即同步除微信读书外的所有「已配置」数据源（微信读书由 weread.yml 单独负责）。
#   2) 手动：Actions 页面 Run workflow，选择 plugin_id。
#      - plugin_id = "all"（默认）→ 同步所有已配置数据源
#      - plugin_id = 具体插件（如 github / douban / flomo / rss / xiaoyuzhou / bilibili …）
#        → 只同步该单一数据源
#   3) 外部 Webhook：repository_dispatch，event_type = notionhub-sync，
#      触发后同步所有已配置数据源（适合各数据源更新后近实时触发）。
#
# 已内置的 33 个自托管插件（未配置凭证的会被自动安全跳过，不会报错）：
#   weread, flomo, github, rss, douban, telegram, netease, xiaoyuzhou, keep,
#   toggl, forest, applemusic, douyin, youtube, gutu, trakt, dayone, ticktick,
#   duolingo, bilibili, beidanci,
#   spotify, strava, weibo, xiaohongshu, jike, podcast, applepodcast,
#   daily, daily-weather, daily-location, guwendao, fix
#
# 需要配置的 Secrets（Settings → Secrets → Actions，按需填对应数据源）：
#   通用：NOTION_TOKEN、NOTION_PAGE（必填）
#   weread → WEREAD_API_KEY          github → GH_TOKEN
#   douban → DOUBAN_BOOK_URLS        bilibili → BILIBILI_EXPORT
#   douyin → DOUYIN_EXPORT           xiaohongshu → XIAOHONGSHU_EXPORT
#   flomo → FLOMO_EXPORT             telegram → TELEGRAM_EXPORT
#   netease → NETEASE_PLAYLIST       keep → KEEP_EXPORT     forest → FOREST_EXPORT
#   applemusic → APPLEMUSIC_EXPORT   youtube → YOUTUBE_EXPORT / YOUTUBE_API_KEY
#   gutu → GUTU_EXPORT               dayone → DAYONE_EXPORT ticktick → TICKTICK_EXPORT
#   duolingo → DUOLINGO_EXPORT       beidanci → BEIDANCI_EXPORT
#   trakt → TRAKT_CLIENT_ID/TRAKT_TOKEN  toggl → TOGGL_API_TOKEN
#   rss → RSS_FEEDS                  xiaoyuzhou → XIAOYUZHOU_FEEDS
#   spotify → SPOTIFY_TOKEN（或 SPOTIFY_CLIENT_ID + SPOTIFY_CLIENT_SECRET）
#   strava → STRAVA_TOKEN            weibo → WEIBO_UID（可选 WEIBO_COOKIE）
#   jike → JIKE_EXPORT               podcast → PODCAST_OPML
#   applepodcast → APPLEPODCAST_OPML daily → DAILY_NOTES_DIR
#   daily-weather → DAILY_WEATHER_LOCATION   daily-location → DAILY_LOCATION_LOCATION
#   guwendao → GUWENDAO_EXPORT       fix → 无需额外凭证
#   可选：OPENAI_API_KEY（开启 AI 导读设置项时需要）、STORAGE_*（媒体上传）

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: "要同步的插件 id；填 all 同步全部已配置数据源"
        type: string
        default: "all"
      full:
        description: "weread 专用：备份并重建全部数据库行"
        type: boolean
        default: false
      retries:
        description: "同步失败最大尝试次数"
        type: number
        default: 2
      verbose:
        description: "开启调试日志（写入 logs/）"
        type: boolean
        default: false
      concurrency:
        description: "并发拉取书籍数（CONCURRENCY，默认 4）"
        type: number
        default: 4
  repository_dispatch:
    # Webhook 触发：外部系统可 POST 到
    # POST /repos/<owner>/<repo>/dispatches  (event_type: notionhub-sync)
    # 触发后同步所有已配置数据源。
    types: [notionhub-sync]
  schedule:
    # GitHub Actions schedules use UTC。修改此 cron 即可调整同步频率。
    - cron: "0 21 * * *" # 每天北京时间凌晨 05:00（UTC 21:00）

# 防止同一时刻多次运行重叠：新触发会排队而非互相干扰。
concurrency:
  group: notionhub-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # checkout
  issues: write # 失败时创建 Issue 通知

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync to Notion
        uses: ./
        with:
          # 事件类型决定同步范围：
          #  - schedule / repository_dispatch / workflow_dispatch(plugin_id=all) → 全部已配置数据源
          #  - workflow_dispatch(指定 plugin_id) → 仅该单一数据源
          all-plugins: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.plugin_id == 'all'
                || github.event_name == 'schedule'
                || github.event_name == 'repository_dispatch' }}
          plugin-id: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.plugin_id != 'all'
                && inputs.plugin_id || 'weread' }}
          exclude: weread
          full: ${{ inputs.full || 'false' }}
          retries: ${{ inputs.retries || '2' }}
          verbose: ${{ inputs.verbose || 'false' }}
          concurrency: ${{ inputs.concurrency || '4' }}
      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const today = new Date().toISOString().slice(0, 10);
            const title = `NotionHub 同步失败（${today}）`;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: "open" });
            if (existing.data.some((i) => i.title === title)) {
              core.info("今日失败通知已存在，跳过创建");
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body:
                "自动同步在最近一次运行中失败，请检查 Actions 日志。\n\n" +
                "恢复方式：在 Actions 页面手动重新触发（Run workflow），" +
                "或先运行 `weread2notion credentials verify` 确认各数据源凭证是否有效。",
              labels: ["sync-failure"],
            });
